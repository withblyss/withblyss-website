<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1F0A2C;background:#FFFDFB;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
main{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.glow{position:absolute;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}.g1{width:320px;height:280px;left:50%;top:12%;background:#E9DAF6;transform:translateX(-80%)}.g2{width:280px;height:240px;left:50%;top:22%;background:#F8E4B6;transform:translateX(-15%)}
.card{position:relative;z-index:2;width:100%;max-width:400px;background:#fff;border:1px solid #ECE6F0;border-radius:28px;padding:36px 26px 28px;box-shadow:0 24px 60px rgba(42,14,58,.1);text-align:center;animation:up .6s cubic-bezier(.2,.7,.2,1)}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.mark{position:relative;width:64px;height:64px;border-radius:18px;background:#3A1450;display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.tick{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;border-radius:50%;background:#2E9E5B;border:3px solid #fff;display:flex;align-items:center;justify-content:center;animation:pop .5s .35s both cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(0)}}
h1{font-size:27px;letter-spacing:-.7px;font-weight:800;margin-bottom:8px}.lead{font-size:15px;line-height:1.6;color:#6E5C7D;margin-bottom:24px}
.go{display:block;background:#3A1450;color:#fff;text-decoration:none;border-radius:999px;padding:15px;font-size:15px;font-weight:800}.go:active,.go:hover{background:#521E6E}
.note{margin-top:14px;font-size:12.5px;line-height:1.5;color:#8E8299}
@media (prefers-reduced-motion:reduce){.card,.tick{animation:none}}</style></head><body>
